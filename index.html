<script>
/* 브라우저 캐시 우회: 열 때마다 캐시를 거치지 않고 서버의 최신 파일을 확인해서, 버전이 다르면 새 주소(?v=)로 다시 연다.
   (파일을 고쳐 올릴 때 BUILD 값을 바꾼다. 내 컴퓨터에서 파일로 직접 열었을 때는 하지 않는다.) */
const BUILD = '20261117-1545';
if (location.protocol.startsWith('http')) {
  fetch(location.pathname, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    const m = t.match(/const BUILD = '([^']+)'/);
    const seen = new URLSearchParams(location.search).get('v');
    if (m && m[1] !== BUILD && seen !== m[1]) location.replace(location.pathname + '?v=' + m[1] + location.hash);
  }).catch(() => {});
}
</script>

<!-- ═════════ 엔진: 글자를 3D 좌표에 놓고, 회전시켜 화면에 투영한다 ═════════ -->
<script>
const TAU = Math.PI * 2;
const rand = (a, b) => a === undefined ? Math.random() : b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = s => { const a = typeof s === 'string' ? [...s] : s; return a[Math.random() * a.length | 0]; };
const source = () => document.getElementById('scene').textContent.replace(/^\n/, '').trimEnd();

const stages = [];
let building = null;
function stage(name, secs, build) { building = { name, secs, items: [], out: 0 }; stages.push(building); build(); }
function put(kind, x, y, z, ch, color, extra) {
  building.items.push(Object.assign({ kind, x, y, z, ch, color, ph: rand(TAU), born: 0 }, extra));
}
function act(fn) { building.items.push(fn); }
let firework = () => {}, say = () => {};          // 부팅 스크립트에서 채워진다
</script>

<!-- ═════════ 장면: 아래 패널에 그대로 표시되고, 읽히는 순서대로 실행 결과가 나타나는 진짜 코드 ═════════ -->
<script id="scene">
// christmas_tree.js — 화면에 보이는 것은 전부 '글자'입니다 🎄
// 지금 읽히고 있는 이 코드가, 읽히는 순서대로 트리를 세웁니다.

const H = 9.5, R = 4.2, Y0 = 1.1;              // 트리 높이 · 밑면 반지름 · 밑동 높이
const INK = source().replace(/\s/g, '');       // 이 코드의 글자들이 곧 나뭇잎이 된다
const cone = t => R * (1 - t) * (0.7 + 0.3 * (1 - (t * 6) % 1));   // 층층이 퍼지는 가지

// 1. 밤하늘 — 별을 흩뿌린다
stage('sky', 2.2, () => {
  for (let i = 0; i < 240; i++)
    put('sky', rand(-1, 1), rand(0, 1), 0, pick('..··*+'), pick(['ICE', 'WHITE', 'GOLD']));
});

// 2. 눈밭 — 원판 위에 점을 깐다
stage('ground', 2, () => {
  for (let i = 0; i < 520; i++) {
    const r = 8.5 * Math.sqrt(rand()), a = rand(TAU);
    put('ground', r * Math.cos(a), 0, r * Math.sin(a), pick('.,·_*'), 'ICE');
  }
});

// 3. 나무 기둥
stage('trunk', 1.5, () => {
  for (let i = 0; i < 150; i++) {
    const a = rand(TAU);
    put('trunk', 0.5 * Math.cos(a), rand(0, Y0 + 0.5), 0.5 * Math.sin(a), pick('|#H'), 'BROWN');
  }
});

// 4. 나뭇잎 — 글자 3,000개를 원뿔 모양의 3차원 좌표에 뿌린다
stage('leaves', 9, () => {
  const N = 3000;
  for (let i = 0; i < N; i++) {
    const t = 1 - Math.sqrt(1 - i / N);                       // 아래에서 위로, 넓은 곳일수록 촘촘하게
    const a = rand(TAU), r = cone(t) * (0.4 + 0.6 * Math.sqrt(rand()));
    put('leaf', r * Math.cos(a), Y0 + t * H, r * Math.sin(a), INK[i % INK.length], pick(['G1', 'G2', 'G3', 'G4']));
  }
});

// 5. 가지 끝에 내려앉은 눈
stage('frost', 2.5, () => {
  for (let i = 0; i < 380; i++) {
    const t = rand() ** 0.6, a = rand(TAU), r = cone(t) * rand(0.9, 1.05);
    put('frost', r * Math.cos(a), Y0 + t * H + 0.12, r * Math.sin(a), pick('*·°'), 'WHITE');
  }
});

// 6. 리본 — 문장이 나선을 따라 트리를 감고 흐른다
stage('ribbon', 4, () => {
  const lines = [['GOLD', 'print("Merry Christmas!") ', 0], ['PINK', 'while (true) { joy++; } ', Math.PI]];
  for (const [color, text, turn] of lines) {
    const path = u => {
      const s = 1 - Math.sqrt(1 - u), r = R * (1 - s) * 0.96 + 0.25, a = s * TAU * 4.5 + turn;
      return [r * Math.cos(a), Y0 + s * H, r * Math.sin(a)];
    };
    for (let i = 0; i < 300; i++)
      put('ribbon', 0, 0, 0, text[(299 - i) % text.length], color, { s: i / 300, path });
  }
});

// 7. 전구 — 색색으로 깜빡인다
stage('lights', 3, () => {
  for (let i = 0; i < 120; i++) {
    const t = rand(0.03, 0.93), a = rand(TAU), r = cone(t) * 0.98;
    put('light', r * Math.cos(a), Y0 + t * H, r * Math.sin(a), pick('o●@'), pick(['RED', 'GOLD', 'BLUE', 'PINK', 'VIOLET', 'WHITE']));

// 8. 선물 상자 — 상자 겉면에 '#', 리본 띠에는 '='
stage('gifts', 3, () => {

    put('snow', rand(-9, 9), rand(0, 14), rand(-9, 9), pick('*·.+'), 'WHITE', { v: rand(0.5, 1.5) });

<script>
(() => {
  const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;   // 화면을 건드리기 전의 원본 (공유 사본의 재료)

  const HEX = { G1: '#19c463', G2: '#2fe07f', G3: '#0f9d4d', G4: '#6cf0a4', GOLD: '#ffcf5a', RED: '#ff3b5c', BLUE: '#4fb6ff',

  /* ── 글자 종류별 설정: f 글자크기, gain 밝기, a/w 깜빡임 진폭/속도, glow 후광 ── */
  const KIND = {
    sky:    { f: .30, gain: .6,  a: .8,  w: 1.4 },
    ground: { f: .30, gain: .55, a: .35, w: 1.1 },
    trunk:  { f: .36, gain: .8,  a: 0,   w: 0 },
    leaf:   { f: .36, gain: .82, a: .32, w: 2.1 },
    frost:  { f: .36, gain: 1,   a: .5,  w: 3 },
    gift:   { f: .34, gain: .95, a: 0,   w: 0 },
    ribbon: { f: .40, gain: 1.1, a: .15, w: 4, bold: 1 },
    light:  { f: .50, gain: 1.2, a: .8,  w: 3.2, glow: 1.2, bold: 1 },
    ray:    { f: .42, gain: 1,   a: .4,  w: 5 },
    star:   { f: 1.8, gain: 1.2, a: .12, w: 4, glow: 4.2 },
    snow:   { f: .36, gain: .9,  a: .3,  w: 2, nofly: 1 },
  };
  const ORDER = Object.keys(KIND);
  let live = {};
  const sparks = [], flashes = [];

  /* ── 화면 배치 ── */
  let W, HH, areaH, unit, cx, baseY, DPR;
  const CAM = 30, TILT = 0.16, st = Math.sin(TILT), ct = Math.cos(TILT);
  function resize() {
    W = innerWidth; HH = innerHeight; DPR = Math.min(devicePixelRatio || 1, 1.5);
    cv.width = W * DPR; cv.height = HH * DPR;

    unit = Math.min(W / 13.5, (areaH - Math.min(areaH * .19, 120)) / 14.6);

  }

  /* ── 코드 패널: 장면 스크립트의 원문을 그대로 표시 ── */

  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const RE = /(\/\/.*$)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")|\b(const|let|for|of|if|return|new)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)(?=\()|\b([A-Z][A-Z0-9_]*)\b/g;
  const paint = line => {
    let out = '', last = 0, m; RE.lastIndex = 0;

      const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'n' : m[5] ? 'f' : 'K';

  };
  codeEl.innerHTML = LINES.map((l, i) => `<div class="ln"><i>${i + 1}</i><span>${paint(l) || ' '}</span></div>`).join('');
  const lineEls = [...codeEl.children];

  /* ── 타임라인: 각 stage(...) 블록이 차지하는 줄 범위와 읽는 시간 ── */
  const starts = [];
  LINES.forEach((l, i) => { if (/^stage\(/.test(l)) starts.push(i > 0 && LINES[i - 1].startsWith('//') ? i - 1 : i); });
  const timeline = [{ stage: null, l0: 0, l1: starts[0] - 1, secs: 1.8 }];
  stages.forEach((s, k) => timeline.push({ stage: s, l0: starts[k], l1: (starts[k + 1] ?? LINES.length) - 1, secs: s.secs }));
  let acc = 0; for (const seg of timeline) { seg.start = acc; acc += seg.secs; seg.end = acc; }
  const TOTAL_ITEMS = stages.reduce((n, s) => n + s.items.filter(i => typeof i !== 'function').length, 0);

  /* ── 상태 ── */
  let now = 0, T = 0, si = 0, done = false, curLine = -1, scrollY = 0, scrollTo = 0, lineRect = null;
  let speed = 1, elapsed = 0;
  const SPEEDS = [0.5, 1, 2, 4, 8];
  let rot = 0.4, rotVel = 0, dragging = false, nextFw = 0, fps = 60, frame = 0, letters = 0, lightsOn = 0;

  function reset() {
    live = {}; for (const k of ORDER) live[k] = [];
    for (const s of stages) s.out = 0;
    sparks.length = flashes.length = 0;
    T = 0; elapsed = 0; si = 0; done = false; curLine = -1; letters = 0; lightsOn = 0;
    lineEls.forEach(e => e.className = 'ln');
    $('title').classList.remove('show'); $('prog').style.opacity = 1;
    $('status').textContent = '● running'; $('status').style.color = '';

  function setLine(i, frac) {

      lineEls[i].className = 'ln cur';

  /* 한 줄이 읽힐 때, 그 줄의 위치에서 글자가 태어나 제자리로 날아간다 */
  function emit(item) {
    if (typeof item === 'function') return item();
    item.born = now;
    item.fly = KIND[item.kind].nofly ? 0 : rand(.7, 1.35) / Math.max(1, Math.sqrt(speed));
    item.arc = rand(10, 90);
    item.fx = lineRect ? lineRect.left + rand(Math.max(40, Math.min(lineRect.width, W * .8))) : cx;

  function releaseTo(seg, p) {

  function read(dt) {
    if (done) return;

    if (si >= timeline.length) {

      lineEls[curLine].className = 'ln read';

    }
    const seg = timeline[si], p = (T - seg.start) / seg.secs;
    const lf = seg.l0 + p * (seg.l1 - seg.l0 + 1), li = Math.min(seg.l1, Math.floor(lf));
    setLine(li, Math.min(1, lf - li));
    releaseTo(seg, p);
    if (frame % 4 === 0) {
      const bar = '█'.repeat(Math.round(p * 16)).padEnd(16, '░');
      $('prog').textContent = `[${String(si).padStart(2, '0')}/${stages.length}] ${(seg.stage ? seg.stage.name : 'init').padEnd(7)} ${bar} ${String(Math.round(p * 100)).padStart(3)}%`;
    }
  }

  /* ── 불꽃: 글자가 터진다 ── */
  const sparkCh = () => { const g = typeof glyphs === 'function' ? glyphs() : []; return g.length ? pick(g) : pick('*+·•01{}<>#;=/'); };
  firework = (x, y, z = 0) => {
    const cols = [pick(['GOLD', 'RED', 'BLUE', 'PINK', 'VIOLET', 'G4']), pick(['WHITE', 'GOLD', 'ICE', 'PINK'])];
    const ring = Math.random() < .3, n = 110, sp = rand(3.2, 5);

      const a = rand(TAU), e = ring ? 0 : Math.acos(rand(-1, 1)) - Math.PI / 2, v = sp * (ring ? 1 : rand(.45, 1));

  say = text => { $('title').textContent = TITLE || text; $('title').classList.add('show'); };

  /* ── 매 프레임: 회전 → 투영 → 깊이에 따라 밝기 → 글자 찍기 ── */
  function draw(dt) {

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const starY = 1.1 + 9.5 + 0.7, starSc = CAM / (CAM - starY * st);
    const starSX = cx, starSY = baseY - starY * ct * starSc * unit;
    let lastStyle = '';

    for (const kind of ORDER) {

      if (!list.length) continue;

        let lvl = b * tw * K.gain * (LV - 1), pal = PAL[p.color];

        } else {

        ctx.fillText(p.ch, sx, sy);
      }
    }

    drawFace();
    lastStyle = '';

    /* 불꽃 */
    ctx.font = KIND.ray.font;
    const drag = Math.pow(.3, dt);
    for (let i = sparks.length - 1; i >= 0; i--) {

      s.vx *= drag; s.vz *= drag; s.vy = s.vy * drag - 1.6 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;

      const style = PAL[s.color][lvl];

    }

      const g = unit * (1.5 + (.45 - f.life) * 9);
      ctx.globalAlpha = f.life / .45;

  /* ── 얼굴: 사진을 칸마다 밝기로 재서 글자로 바꾸고, 밝은 곳일수록 앞으로 튀어나오게 3D로 놓는다 ── */
  const RAMP = " .,:;-~=+*xo%#&@";
  let faceR = 0, faceCols = 0;

  /* ── 구성 문자열 제한: 지정한 글자들만으로 트리·얼굴·불꽃을 그린다 ── */
  let CHARSET = '';
  const store = { get: k => { try { return localStorage.getItem(k + COPY); } catch (e) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k + COPY, v); } catch (e) {} } };
  const glyphs = () => [...CHARSET.replace(/\s/g, '')];
  const density = (() => {                                   // 글자의 '획이 많은 정도'를 실제로 그려서 잰다
    const c = document.createElement('canvas'); c.width = c.height = 28;

    const g = glyphs(); let i = 0;
    for (const st of stages) for (const p of st.items) {
      if (typeof p === 'function' || !BODY[p.kind]) continue;
      if (p.ch0 === undefined) p.ch0 = p.ch;
      p.ch = g.length ? g[i++ % g.length] : p.ch0;           // 적은 순서대로 반복해서 채운다
    }
    reloadFaces(); syncMenu();
  }

  /* ── 배경 사진: 진짜 이미지를 화면 가득 깔고, 글자 트리가 묻히지 않게 어둡게 덮는다 ── */
  let bgImg = null, bgSmall = null;
  function loadBg(src, save) {
    const img = new Image();
    img.onload = () => {

    }

  }
  const openMenu = on => { $('menu').hidden = !on; $('menuBtn').setAttribute('aria-expanded', on); $('menuBtn').innerHTML = on ? '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>' : '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>'; };
  $('menuBtn').addEventListener('click', () => openMenu($('menu').hidden));
  addEventListener('pointerdown', e => { if (!$('menu').hidden && !e.target.closest('#menu, #menuBtn')) openMenu(false); }, true);
  $('menu').addEventListener('click', e => {
    const act = e.target.dataset.act, del = e.target.dataset.del;
    if (act) {                                               // 사진 고르기
      target = act === 'B' ? 'bg' : slots.find(s => s.id === act);
      $('faceFile').value = ''; $('faceFile').click(); openMenu(false);
    } else if (del === 'B') { bgImg = bgSmall = null; store.set('xmasBg', 'none'); renderBg(); syncMenu(); }
    else if (del === 'T') { $('titleText').value = ''; setTitle(''); }
    else if (del === 'C') { $('chars').value = ''; store.set('xmasChars', ''); applyCharset(''); }
    else if (del) {
      const s = slots.find(s => s.id === del);
      s.parts = []; s.src = s.small = null; store.set(s.key, 'none'); syncMenu();
    }
  });
  function setTitle(text, save = true) {               // 적는 즉시 화면에 보여준다
    TITLE = text.trim();
    if (save) store.set('xmasTitle', text);
    say('Merry Christmas'); syncMenu();
  }
  $('titleText').addEventListener('input', e => setTitle(e.target.value));

  /* 문구 글꼴·크기: CSS 변수만 바꾼다 (웹폰트를 못 불러오면 비슷한 기본 글꼴로 대체) */
  const FONTS = {
    script: "'Great Vibes', 'Snell Roundhand', 'Apple Chancery', cursive",
    pen:    "'Nanum Pen Script', 'Great Vibes', cursive",
    serif:  "'Gowun Batang', 'Noto Serif KR', 'Apple Myungjo', Batang, serif",
    sans:   "'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif",
    bold:   "'Black Han Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif",
    mono:   getComputedStyle(document.body).fontFamily,
  };
  let TFONT = 'script', TSIZE = 100;
  function setFont(v, save = true) {
    TFONT = FONTS[v] ? v : 'script'; $('titleFont').value = TFONT;
    $('title').style.setProperty('--tf', FONTS[TFONT]);
    $('title').style.fontWeight = TFONT === 'sans' || TFONT === 'serif' || TFONT === 'mono' ? 700 : 400;
    if (save) { store.set('xmasFont', TFONT); say('Merry Christmas'); }
  }
  function setSize(v, save = true) {
    TSIZE = Math.max(50, Math.min(200, +v || 100)); $('titleSize').value = TSIZE; $('titleSizeOut').textContent = TSIZE + '%';
    $('title').style.setProperty('--ts', TSIZE / 100);
    if (save) { store.set('xmasSize', TSIZE); say('Merry Christmas'); }
  }
  $('titleFont').addEventListener('change', e => setFont(e.target.value));
  $('titleSize').addEventListener('input', e => setSize(e.target.value));
  $('chars').addEventListener('input', e => { store.set('xmasChars', e.target.value); applyCharset(e.target.value); });
  const BAKED = window.BAKED || {}, COPY = BAKED.id || '';
  const slots = [                                   // 좌우 대칭으로 두 자리
    { side: -1, key: 'xmasFace',  id: 'L', name: '좌측', parts: [], src: null },
    { side:  1, key: 'xmasFaceR', id: 'R', name: '우측', parts: [], src: null },
  ];
  function faceLayout() {
    faceR = Math.max(62, Math.min(W * .15, areaH * .2, 125));
    return Math.max(28, Math.min(60, Math.round(faceR * 2 / (0.6 * 5.6))));
  }
  function loadFace(slot, src, save) {
    const img = new Image();
    img.onload = () => {
      const cols = faceCols = faceLayout(), rows = Math.round(cols / 2);
      const c = document.createElement('canvas'); c.width = cols; c.height = rows;
      const x = c.getContext('2d', { willReadFrequently: true });
      const m = Math.min(img.width, img.height);                       // 가운데 정사각형만 사용
      x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, cols, rows);
      const d = x.getImageData(0, 0, cols, rows).data, lum = [];
      let lo = 1, hi = 0;
      for (let i = 0; i < cols * rows; i++) {
        const l = (d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114) / 255;
        lum.push(l); if (l < lo) lo = l; if (l > hi) hi = l;
      }
      const parts = [], RP = ramp();
      const born = () => ({ born: now, fly: rand(.8, 1.7), arc: rand(10, 80), fx: rand(W), fy: areaH + rand($('panel').offsetHeight * .6), ph: rand(TAU) });
      for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
        const u = (q + .5) / cols * 2 - 1, v = (r + .5) / rows * 2 - 1;
        if (u * u + v * v > 1) continue;                                 // 프로필 사진처럼 동그랗게
        const l = (lum[r * cols + q] - lo) / Math.max(.05, hi - lo);
        const ch = RP[Math.min(RP.length - 1, l * RP.length | 0)];
        if (ch !== ' ') parts.push(Object.assign({ u, v, l, ch, color: 'FACE' }, born()));
      }
      for (let i = 0; i < 64; i++) {                                     // 금빛 테두리
        const a = i / 64 * TAU;
        parts.push(Object.assign({ u: Math.cos(a) * 1.1, v: Math.sin(a) * 1.1, l: .5, ch: '*+'[i & 1], color: 'GOLD', rim: 1 }, born()));
      }
      slot.parts = parts; slot.src = src;
      syncMenu();
      const t = document.createElement('canvas'); t.width = t.height = 240;   // 작은 사본: 저장·공유용
      t.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 240, 240);
      slot.small = t.toDataURL('image/jpeg', .85);
      if (save) store.set(slot.key, slot.small);   // 다음에 열어도 남도록
    };
    img.src = src;
  }
  function drawFace() {
    const R = faceR || (faceLayout(), faceR), y0 = 16 + R * 1.25 + (W < 700 ? 56 : 0);
    let last = '', fontSet = false;
    for (const slot of slots) {
      const x0 = slot.side < 0 ? 14 + R * 1.25 : W - 14 - R * 1.25;      // 화면 중심선 기준 좌우 대칭
      if (!slot.parts.length) continue;
      if (!fontSet) { ctx.font = `700 ${(R * 2 / faceCols / .6).toFixed(1)}px ${getComputedStyle(document.body).fontFamily}`; fontSet = true; }
      const yaw = -slot.side * .22, pit = 0;                    // 움직이지 않고, 트리 쪽으로 살짝만 돌린 채 고정 (좌우 거울 대칭)
      const c = Math.cos(yaw), s = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit);
      for (const p of slot.parts) {
        const dz = p.rim ? 0 : (p.l - .45) * .55;                        // 밝기 → 깊이 (부조)
        const X = p.u * c + dz * s, Z1 = -p.u * s + dz * c;
        const Y = p.v * cp - Z1 * sp, Z = p.v * sp + Z1 * cp, k = 1 + Z * .3;
        let sx = x0 + X * R * k, sy = y0 + Y * R * k, pal = PAL[p.color];
        let lvl = p.rim ? 7 + 4 * Math.sin(now * 4 + p.ph) : (2.5 + p.l * 8.5) * (.85 + .45 * Z);
        const age = now - p.born;
        if (age < p.fly) {
          const t = age / p.fly, e = 1 - (1 - t) ** 3;
          sx = p.fx + (sx - p.fx) * e; sy = p.fy + (sy - p.fy) * e - Math.sin(t * Math.PI) * p.arc; pal = PAL.WHITE; lvl = 5 + 6 * t;
        } else if (age - p.fly < .45) lvl += (1 - (age - p.fly) / .45) * 6;
        lvl = lvl | 0; if (lvl < 1) continue; if (lvl > LV - 1) lvl = LV - 1;
        if (pal[lvl] !== last) ctx.fillStyle = last = pal[lvl];
        ctx.fillText(p.ch, sx, sy);
      }
    }
  }
  let target = slots[0];
  const pickFile = (f, slot) => { if (!f || !f.type.startsWith('image/')) return; const r = new FileReader(); r.onload = () => slot === 'bg' ? loadBg(r.result, true) : loadFace(slot, r.result, true); r.readAsDataURL(f); };
  $('faceFile').addEventListener('change', e => pickFile(e.target.files[0], target));
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
  addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
  addEventListener('drop', e => {                                        // 놓은 쪽(왼쪽/오른쪽 절반) 자리에 들어간다
    e.preventDefault(); document.body.classList.remove('drop');
    pickFile(e.dataTransfer.files[0], slots[e.clientX < W / 2 ? 0 : 1]);
  });
  addEventListener('paste', e => pickFile([...e.clipboardData.files][0], slots.find(s => !s.src) || slots[0]));   // 빈 자리부터
  /* ── 공유: 사진을 파일 안에 심은 HTML 사본을 만든다 (서버 불필요, 파일 하나만 보내면 됨) ── */
  $('shareBtn').addEventListener('click', async () => {
    const faces = {};
    for (const s of slots) if (s.small) faces[s.key] = s.small;
    const baked = { id: '-' + Date.now().toString(36), faces, bg: bgSmall, chars: CHARSET, title: TITLE, font: TFONT, size: TSIZE };
    const html = PRISTINE.replace(/<script id="baked">[\s\S]*?<\/script>/, () => `<script id="baked">window.BAKED = ${JSON.stringify(baked)};<\/script>`);
    const file = new File([html], 'merry-christmas.html', { type: 'text/html' });
    const btn = $('shareBtn'), icon = btn.innerHTML;
    const flash = () => { btn.innerHTML = '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>'; btn.classList.add('ok'); setTimeout(() => { btn.innerHTML = icon; btn.classList.remove('ok'); }, 2200); };   // 완료되면 잠깐 체크 표시
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {   // 휴대폰: 공유 시트로 바로 보내기
        await navigator.share({ files: [file], title: 'Merry Christmas 🎄' });
        return flash();
      }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a');                                 // 그 외: 파일로 저장
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    flash();
  });
  const reloadFaces = () => slots.forEach(s => s.src && loadFace(s, s.src));

  let prev = performance.now();
  function loop(ts) {
    const dt = Math.max(0, Math.min(.05, (ts - prev) / 1000)); prev = ts; now += dt; frame++;
    fps += ((1 / Math.max(dt, .001)) - fps) * .05;
    if (!dragging) { rot += (0.32 + rotVel) * dt; rotVel *= Math.pow(.2, dt); }
    read(dt);
    scrollY += (scrollTo - scrollY) * Math.min(1, dt * 9);
    codeEl.style.transform = `translateY(${-scrollY.toFixed(1)}px)`;
    if (done && now > nextFw) { firework(rand(-7, 7), rand(7, 13)); nextFw = now + rand(1.2, 3.5); }
    draw(dt);
    if (frame % 6 === 0) {
      const deg = ((rot * 180 / Math.PI) % 360 + 360) % 360;
      $('hud').innerHTML = `rotation <b>${deg.toFixed(1)}°</b>\nlights   <b>${lightsOn}</b>\nletters  <b>${letters.toLocaleString()}</b> / ${TOTAL_ITEMS.toLocaleString()}\nfps      <b>${Math.round(fps)}</b>`;
    }
    requestAnimationFrame(loop);
  }

  /* ── 입력: 드래그 회전, 클릭 불꽃 ── */
  let down = null;
  addEventListener('pointerdown', e => {
    if (e.target.closest('button, #menu')) return;
    down = { x: e.clientX, y: e.clientY, lx: e.clientX, moved: 0 }; dragging = true;
  });
  addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.lx; down.lx = e.clientX; down.moved += Math.abs(dx);
    rot += dx * .008; rotVel = dx * .5;
  });
  addEventListener('pointerup', e => {
    if (!down) return;
    if (down.moved < 6 && e.clientY < areaH) firework((e.clientX - cx) / unit, (baseY - e.clientY) / unit / ct);
    down = null; dragging = false;
  });
  addEventListener('pointercancel', () => { down = null; dragging = false; });
  addEventListener('resize', () => { resize(); reloadFaces(); });
  $('replayBtn').addEventListener('click', () => { reset(); reloadFaces(); });

  /* ── 배속: 버튼을 누를 때마다 0.5x → 1x → 2x → 4x → 8x, 키보드 1~5 또는 +/- ── */
  function setSpeed(v) {
    speed = v;
    $('speedBtn').textContent = `▶ ${v}x`;
    $('speedBtn').classList.toggle('on', v !== 1);
  }
  $('speedBtn').addEventListener('click', () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]));
  addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const i = SPEEDS.indexOf(speed);
    if (e.key >= '1' && e.key <= '5') setSpeed(SPEEDS[+e.key - 1]);
    else if (e.key === '+' || e.key === '=') setSpeed(SPEEDS[Math.min(SPEEDS.length - 1, i + 1)]);
    else if (e.key === '-') setSpeed(SPEEDS[Math.max(0, i - 1)]);
  });

  /* ── 캐롤: Jingle Bells (퍼블릭 도메인)을 WebAudio 종소리로 합성 ── */
  let actx, master, timer, playing = false;
  const F = { C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392 };
  const A = 'E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4 ';
  const SONG = (A + 'F1 F1 F1.5 F.5 F1 E1 E1 E.5 E.5 E1 D1 D1 E1 D2 G2 ' + A + 'F1 F1 F1 F1 F1 E1 E1 E.5 E.5 G1 G1 F1 D1 C4')
    .split(' ').map(n => [F[n[0]], +n.slice(1)]);
  const BEAT = .3;
  function tone(f, t, vol, dur, type = 'sine') {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
  }
  function playLoop(start) {
    let t = start, beats = 0;
    for (const [f, b] of SONG) {
      const d = Math.max(.6, b * BEAT * 2.2);
      tone(f * 2, t, .22, d); tone(f * 4, t, .06, d); tone(f * 6.01, t, .02, d);
      t += b * BEAT; beats += b;
    }
    for (let i = 0; i < beats; i += 2) tone((i % 4 ? F.G : F.C) / 2, start + i * BEAT, .12, BEAT * 1.8, 'triangle');
    timer = setTimeout(() => playLoop(t + BEAT * 2), (t - actx.currentTime - .5) * 1000);
  }
  $('musicBtn').addEventListener('click', e => {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!playing) {
      actx.resume(); master = actx.createGain(); master.gain.value = .8; master.connect(actx.destination);
      playLoop(actx.currentTime + .1);
    } else {
      clearTimeout(timer); master.gain.setTargetAtTime(0, actx.currentTime, .05);
      const old = master; setTimeout(() => old.disconnect(), 400);
    }
    playing = !playing; e.currentTarget.classList.toggle('on', playing);
    const label = playing ? '캐롤 끄기' : '캐롤 켜기';
    e.currentTarget.title = label; e.currentTarget.setAttribute('aria-label', label); e.currentTarget.setAttribute('aria-pressed', playing);
  });

  resize(); reset(); requestAnimationFrame(loop);
  const saved = (k, baked) => { const v = store.get(k); return v === 'none' ? null : v || baked || null; };   // 이 사본에서 바꾼 것 → 없으면 파일에 심어진 것
  setFont(store.get('xmasFont') || BAKED.font || 'script', false);
  setSize(store.get('xmasSize') || BAKED.size || 100, false);
  const title0 = store.get('xmasTitle') ?? BAKED.title ?? '';
  if (title0.trim()) { $('titleText').value = title0; TITLE = title0.trim(); }
  const chars0 = store.get('xmasChars') ?? BAKED.chars ?? '';
  if (chars0) { $('chars').value = chars0; applyCharset(chars0); }
  for (const slot of slots) { const v = saved(slot.key, (BAKED.faces || {})[slot.key]); if (v) loadFace(slot, v); }
  const bg0 = saved('xmasBg', BAKED.bg); if (bg0) loadBg(bg0);
  syncMenu();
})();
</script>
</body>
</html>
